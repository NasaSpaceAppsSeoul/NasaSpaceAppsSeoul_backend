apply plugin: 'java-library'

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-actuator'      // /health/live, /health/ready
    api 'org.springframework.boot:spring-boot-starter-cache'
    api 'org.springframework.boot:spring-boot-starter-data-redis'    // 조회 결과 캐시 + data_version
    api 'io.micrometer:micrometer-registry-prometheus'               // /metrics
    api 'io.github.resilience4j:resilience4j-retry:2.2.0'            // 내부 호출 재시도
    api 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'   // 내부 호출 서킷 브레이커
    api 'io.github.resilience4j:resilience4j-micrometer:2.2.0'

    // DB를 쓰는 서비스만 런타임에 붙는다 (insight는 없음)
    compileOnly 'org.springframework.boot:spring-boot-starter-jdbc'
}
