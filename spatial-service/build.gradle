dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'                 // 표 정의 (src/main/resources/db/migration)
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.apache.commons:commons-csv:1.12.0'    // 감지 점·공식 기록 CSV (따옴표 안 쉼표)
    implementation 'org.apache.poi:poi-ooxml:5.3.0'           // 산림청 산불통계.xlsx

    // 테스트: Docker 없이 실제 PostgreSQL을 띄운다
    testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
}
