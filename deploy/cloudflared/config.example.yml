# Cloudflare Tunnel: 내 PC의 서비스들을 api.<도메인> 하나로 공개한다. nginx 없이 경로별로 나눈다.
#
# 처음 한 번 (도메인이 Cloudflare에 연결돼 있어야 함):
#   cloudflared tunnel login
#   cloudflared tunnel create burnline
#   cloudflared tunnel route dns burnline api.example.com
# 이 파일을 config.yml로 복사해 tunnel ID, 경로, 도메인을 바꾼 뒤:
#   cloudflared tunnel --config deploy/cloudflared/config.yml run burnline
# 상시 실행(재부팅 후 자동 시작): cloudflared service install
#
# /internal/**, /health/**, /metrics, DB는 여기에 없으므로 밖에서 접근할 수 없다.

tunnel: <TUNNEL_ID>
credentials-file: C:\Users\<사용자>\.cloudflared\<TUNNEL_ID>.json

ingress:
  # A: catalog (:8081)
  - hostname: api.example.com
    path: ^/api/v1/[^/]+/(meta|regions|geo)(/.*)?$
    service: http://127.0.0.1:8081
  # A: timeseries (:8082)
  - hostname: api.example.com
    path: ^/api/v1/[^/]+/(series|baseline|judgement|export\.csv)(/.*)?$
    service: http://127.0.0.1:8082
  # B: spatial (:8083) — B 서비스 포트에 맞게
  - hostname: api.example.com
    path: ^/api/v1/[^/]+/(map|events|official-fires)(/.*)?$
    service: http://127.0.0.1:8083
  # B: insight (:8084)
  - hostname: api.example.com
    path: ^/api/v1/[^/]+/(insight|top|landing)(/.*)?$
    service: http://127.0.0.1:8084
  - service: http_status:404
