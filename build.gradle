plugins {
    id 'org.springframework.boot' version '3.5.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.burnline'
    version = '0.1.0'

    // Windows에서 프로젝트 경로에 한글(예: 백엔드)이 있으면 Gradle 테스트 프로세스가 클래스를 못 찾는다.
    // 그럴 때만 빌드 출력을 영문 경로(임시 폴더)로 옮긴다. bootJar 위치는 build 후 로그에 찍힌다.
    if (!rootDir.absolutePath.matches('\\p{ASCII}*')) {
        layout.buildDirectory = new File(System.getProperty('java.io.tmpdir'), "burnline-build/${project.name}")
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    // 로컬 JDK가 21보다 높아도 21 바이트코드로 만든다 (도커 이미지는 temurin 21)
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// 실행 가능한 서비스 모듈 공통 설정
configure(subprojects.findAll { it.name != 'common' }) {
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation project(':common')
    }

    bootJar {
        archiveFileName = 'app.jar'
    }
    jar {
        enabled = false
    }

    // ./gradlew dist → backend/dist/{모듈}.jar (java -jar 로 실행)
    tasks.register('dist', Copy) {
        from bootJar
        into rootProject.file('dist')
        rename { "${project.name}.jar" }
    }
}
